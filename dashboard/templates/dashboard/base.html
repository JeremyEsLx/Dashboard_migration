{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tijuana LMS{% endblock %}</title>

    <!-- CDN Libraries -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Shared Styles -->
    <link rel="stylesheet" href="{% static 'dashboard/base.css' %}?v=7">

    <!-- Page-specific Styles -->
    {% block styles %}{% endblock %}
</head>
<body>
    <!-- HEADER -->
    <div class="header">
        <div class="logo-icon">T</div>
        <span style="font-weight:700; letter-spacing:-0.3px;">Tijuana</span>
        <span style="font-weight:400; color:#94a3b8;">LMS Dashboard</span>
    </div>

    <div class="layout">
        <!-- SIDEBAR -->
        <nav class="sidebar">
            <div class="sidebar-section">Dashboards</div>
            <a href="/" class="{% block nav_summary %}{% endblock %}">
                <span class="sidebar-icon">
                    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
                </span>
                Summary
            </a>
            <a href="/performance/" class="{% block nav_performance %}{% endblock %}">
                <span class="sidebar-icon">
                    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 14l4-5 3 3 5-7"/><circle cx="14" cy="5" r="1.5"/></svg>
                </span>
                Performance by User
            </a>
            <a href="/process/" class="{% block nav_process %}{% endblock %}">
                <span class="sidebar-icon">
                    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 12V6"/><path d="M6 12V4"/><path d="M9 12V8"/><path d="M12 12V3"/></svg>
                </span>
                Performance by Process
            </a>
            <a href="/strongstart/" class="{% block nav_trends %}{% endblock %}">
                <span class="sidebar-icon">
                    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 2"/></svg>
                </span>
                Strong Start
            </a>
        </nav>

        <!-- MAIN CONTENT -->
        <main class="main">
            <!-- Page Title -->
            {% block page_title %}{% endblock %}

            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Page-specific Scripts -->
    {% block scripts %}{% endblock %}
</body>
</html>
