{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tijuana LMS{% endblock %}</title>

    <!-- CDN Libraries -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Shared Styles -->
    <link rel="stylesheet" href="{% static 'dashboard/base.css' %}?v=6">

    <!-- Page-specific Styles -->
    {% block styles %}{% endblock %}
</head>
<body>
    <!-- HEADER -->
    <div class="header">
        <div class="logo-icon">T</div>
        TIJUANA LMS
    </div>

    <div class="layout">
        <!-- SIDEBAR -->
        <nav class="sidebar">
            <div class="sidebar-section">Dashboards</div>
            <a href="/" class="{% block nav_summary %}{% endblock %}">
                <span class="sidebar-icon">&#9632;</span> Summary
            </a>
            <a href="/performance/" class="{% block nav_performance %}{% endblock %}">
                <span class="sidebar-icon">&#9650;</span> Performance by User
            </a>
            <a href="/process/" class="{% block nav_process %}{% endblock %}">
                <span class="sidebar-icon">&#9679;</span> Performance by Process
            </a>
            <a href="/strongstart/" class="{% block nav_trends %}{% endblock %}">
                <span class="sidebar-icon">&#9670;</span> Strong Start
            </a>
        </nav>

        <!-- MAIN CONTENT -->
        <main class="main">
            <!-- Page Title -->
            {% block page_title %}{% endblock %}

            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Page-specific Scripts -->
    {% block scripts %}{% endblock %}
</body>
</html>
